[package]
name = "aerith-player"
description = "The one interface through which Aerith drives playback, whatever the engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# mpv speaks JSON over its IPC (ADR-0013, which admitted it for the bench and for this crate).
serde_json = "1.0.154"

# The relay that shows mpv's picture in a plane of the interface's window, on Linux (ADR-0015).
[target.'cfg(target_os = "linux")'.dependencies]
# The interface's own connection, joined with a queue of the relay's: libwayland, as the interface
# uses it.
wayland-client = { version = "0.31", features = ["system"] }
wayland-backend = { version = "0.3", features = ["client_system"] }
# The side facing mpv: the pure-Rust server, never libwayland-server.
wayland-server = { version = "0.31", default-features = false }
# `unstable` holds linux-dmabuf, `staging` fractional scale and content type.
wayland-protocols = { version = "0.32", features = ["client", "server", "staging", "unstable"] }
# The display and surfaces the interface hands over.
raw-window-handle = "0.6"
# `poll`, the checks of the file descriptors mpv sends, and the reads and writes of mpv's socket
# with them.
rustix = { version = "1.1.6", features = ["event", "fs", "net"] }

[features]
# Opens a door into the relay for its fuzz target (fuzz/): never turned on for what ships.
fuzzing = []

[lints]
workspace = true
