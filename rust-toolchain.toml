# The stable toolchain that builds and checks Aerith. The development shell reads this file
# (flake.nix), and so does rustup, on CI's Windows job and for contributors without Nix.
# ADR-0011 says why; bump it on purpose, with `rust-version` in Cargo.toml.
[toolchain]
channel = "1.99.1"
components = ["clippy", "rustfmt", "rust-src", "rust-analyzer"]
profile = "minimal"
