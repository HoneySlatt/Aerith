# The dependency policy that `cargo deny --locked check` enforces (scripts/check.sh runs it). AGENTS.md
# says what a new dependency needs before it is added: a reason, an alternative weighed, a licence
# checked, the owner's go.

[graph]
# The dependencies of every feature of Aerith's crates, not only of the default ones.
all-features = true
# The platforms of Stage 1; each later platform joins at its stage (docs/ROADMAP.md).
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]

[advisories]
# Every RustSec advisory (a vulnerability, an unsound or unmaintained crate) affecting a dependency
# fails the check. One may be ignored only by an entry here that says why. cargo-deny's defaults
# would let an unsound crate through when it is not a direct dependency, and only warn of a yanked
# one.
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
# The licences whose code may enter Aerith's own binaries, store builds included: the MPL-2.0 and
# permissive licences (ADR-0002). Nothing under the GPL. A licence is added here when a dependency
# needs one, after checking that it fits.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
# The LGPL is admitted too (ADR-0002), but crate by crate, whether a direct dependency or not. Cargo
# links Rust crates statically, so a crate under the LGPL obliges Aerith to let users rebuild it with
# their own version of that crate. Each LGPL crate gets an entry here only after a review that says
# how each build of Aerith, store builds included, meets that licence:
# { crate = "name", allow = ["LGPL-2.1-or-later"] }.
exceptions = []
confidence-threshold = 0.8
# The list is a policy, not an inventory: a licence no dependency uses yet stays allowed.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Paths between Aerith's own crates carry no version; that is not a wildcard.
allow-wildcard-paths = true

[sources]
# crates.io alone; a crate from a git repository or another registry needs an entry here.
unknown-registry = "deny"
unknown-git = "deny"
